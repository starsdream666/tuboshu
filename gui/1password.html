<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Password 扩展配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-size: 14px;
        }
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #18a058;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .path-input {
            display: flex;
            gap: 8px;
        }
        .path-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .path-input input:focus {
            outline: none;
            border-color: #18a058;
        }
        .path-input input.error {
            border-color: #d03050;
        }
        .path-input input.success {
            border-color: #18a058;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background .2s;
        }
        .btn-primary {
            background: #18a058;
            color: white;
        }
        .btn-primary:hover {
            background: #0c7a43;
        }
        .status {
            margin-top: 8px;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .status.valid {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.invalid {
            background: #ffebee;
            color: #c62828;
        }
        .status.validating {
            background: #e3f2fd;
            color: #1565c0;
        }
        .hint {
            margin-top: 12px;
            padding: 10px;
            background: #fff8e1;
            border-radius: 4px;
            font-size: 12px;
            color: #f57c00;
            line-height: 1.5;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="close-btn" onclick="window.close()">&times;</button>
        <h2>🔐 1Password 扩展配置</h2>
        
        <div class="form-group">
            <div class="switch-row">
                <label>启用 1Password 扩展</label>
                <label class="switch">
                    <input type="checkbox" id="enableSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label>扩展路径</label>
            <div class="path-input">
                <input type="text" id="pathInput" placeholder="选择 1Password 扩展目录">
                <button class="btn btn-primary" onclick="selectFolder()">浏览</button>
            </div>
            <div id="statusDiv" class="status" style="display: none;"></div>
        </div>
        
        <div class="hint">
            <strong>⚠️ 重要说明：</strong>
            <br><br>
            Electron 只能加载 <strong>unpacked（解压的）Chrome 扩展</strong>，不支持：
            <ul style="margin: 8px 0 8px 20px;">
                <li>Edge 浏览器的扩展</li>
                <li>已安装在浏览器中的扩展</li>
                <li>.crx 打包文件</li>
            </ul>
            <strong>获取方法：</strong>
            <ol style="margin: 8px 0 8px 20px;">
                <li>访问 <a href="#" onclick="openExternal('https://clients2.google.com/service/update2/crx?response=redirect&prodversion=120&x=id%3Daeblfdkhhhdcdjpifhhbdiojplfjncoa%26installsource%3Dondemand%26uc')">下载 1Password CRX</a></li>
                <li>将下载的 .crx 文件重命名为 .zip</li>
                <li>解压到一个文件夹</li>
                <li>选择该文件夹作为扩展路径</li>
            </ol>
        </div>
    </div>

    <script>
        function openExternal(url) {
            if (window.onePasswordApi && window.onePasswordApi.openExternal) {
                window.onePasswordApi.openExternal(url);
            } else {
                window.open(url, '_blank');
            }
        }
        
        const enableSwitch = document.getElementById('enableSwitch');
        const pathInput = document.getElementById('pathInput');
        const statusDiv = document.getElementById('statusDiv');

        // 加载配置
        async function loadConfig() {
            try {
                const config = await window.onePasswordApi.getConfig();
                enableSwitch.checked = config.enabled;
                pathInput.value = config.path || '';
                if (config.path) {
                    validatePath(config.path);
                }
            } catch (e) {
                console.error('加载配置失败:', e);
            }
        }

        // 验证路径
        async function validatePath(path) {
            if (!path) {
                statusDiv.style.display = 'none';
                pathInput.className = '';
                return;
            }
            
            statusDiv.style.display = 'block';
            statusDiv.className = 'status validating';
            statusDiv.textContent = '验证中...';
            
            try {
                const result = await window.onePasswordApi.validatePath(path);
                if (result.valid) {
                    statusDiv.className = 'status valid';
                    statusDiv.textContent = '✓ 有效: ' + (result.extensionName || '1Password 扩展');
                    pathInput.className = 'success';
                } else {
                    statusDiv.className = 'status invalid';
                    statusDiv.textContent = '✗ ' + result.error;
                    pathInput.className = 'error';
                }
            } catch (e) {
                statusDiv.className = 'status invalid';
                statusDiv.textContent = '✗ 验证失败: ' + e.message;
                pathInput.className = 'error';
            }
        }

        // 选择文件夹
        async function selectFolder() {
            try {
                const result = await window.onePasswordApi.selectFolder();
                if (!result.canceled && result.path) {
                    pathInput.value = result.path;
                    await validatePath(result.path);
                    await saveConfig();
                }
            } catch (e) {
                console.error('选择文件夹失败:', e);
            }
        }

        // 保存配置
        async function saveConfig() {
            try {
                await window.onePasswordApi.setConfig({
                    enabled: enableSwitch.checked,
                    path: pathInput.value
                });
            } catch (e) {
                console.error('保存配置失败:', e);
            }
        }

        // 事件监听
        enableSwitch.addEventListener('change', saveConfig);
        pathInput.addEventListener('blur', async () => {
            await validatePath(pathInput.value);
            await saveConfig();
        });

        // 初始化
        loadConfig();
    </script>
</body>
</html>
